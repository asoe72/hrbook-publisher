<!DOCTYPE html:5>
<html>
<head>
    <title>hr-mdbook.js</title>
    <meta http-equiv=Content-Type content="text/html; charset=utf-8">

    <link rel="stylesheet" href="css/style.css" type=text/css rel=stylesheet >
	<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
	<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
	<script src="bootstrap/js/bootstrap.min.js"></script>
    <script src="js/mdbook.js"></script>
	<script>
        $(document).ready(function() {
			initMdBook();
        });
    </script>
    
</head>
<body>
	<div id="main">
		<div id="titlebar" style="text-align:right">
			Version 1.0.0
		</div>
		<div id="client-area" style="margin-left: 2em;">
			<h1 style='font-size:4em;'><b>hr-mdbook.js</b></h1>
			<br><br>
			source-path (.md files)
			<input type="text" id="path-md" class="lineedit" size="60" placeholder="e.g. d:/doc-hrscript"/><br><br>
			<button type="button" id="adjust-md" class="btn btn-default"><span class="glyphicon glyphicon-wrench"></span>adjust-md</button>
			<button type="button" id="bind-book" class="btn btn-default"><span class="glyphicon glyphicon-book"></span>bind-book</button>
			<button type="button" id="print-book" class="btn btn-default"><span class="glyphicon glyphicon-print"></span>print-book</button>
		</div>
    </div>
</body>
</html>
