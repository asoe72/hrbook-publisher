<!DOCTYPE html:5>
<html>
<head>
    <title>hrbook2pdf</title>
    <meta http-equiv=Content-Type content="text/html; charset=utf-8">

	<link rel="icon" href="book-orange-80.png">
    <link rel="stylesheet" href="css/style.css" type=text/css rel=stylesheet >
	<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
	<script src="jquery/code.jquery.com_jquery-3.7.0.min.js"></script>
	<script src="bootstrap/js/bootstrap.min.js"></script>
    <script src="js/application.js"></script>
	<script>
        $(document).ready(function() {
			initApplication();
        });
    </script>
    
</head>
<body>
	<div id="main">
		<div id="titlebar" style="text-align:right">
			Version 1.4.1
		</div>
		<div id="client-area" style="margin-left: 2em;">
			<h1 style='font-size:4em;'><b>hrbook2pdf</b></h1>
			<br><br>
			source-path (.md files)
			<input type="text" id="path-md" class="lineedit" size="60" placeholder="e.g. d:/doc-hrscript"/><br><br>
			<!-- <button type="button" id="adjust-md" class="btn btn-default"><span class="glyphicon glyphicon-wrench"></span>adjust-md</button> -->
			<button type="button" id="bind-book" class="btn btn-default"><span class="glyphicon glyphicon-book"></span>&nbsp;bind-book</button>
			<button type="button" id="print-book" class="btn btn-default"><span class="glyphicon glyphicon-print"></span>&nbsp;print-book</button>
			&nbsp;&nbsp;
			<input type="checkbox" id="toc-without-page">
			<label style="font-weight: lighter"
				title="When TOC exceeds 1 page, some browser fails to show TOC.&#10;In this case, check this option and retry.&#10;(But page numbers are not attached on the TOC items.)">
				&nbsp;TOC. without page no.
			</label>
		</div>
    </div>
</body>
</html>
